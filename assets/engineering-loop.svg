<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="250" viewBox="0 0 1400 250" role="img" aria-labelledby="title desc">
<title id="title">Machine learning engineering loop</title>
<desc id="desc">A six-stage engineering loop from problem framing through monitoring, with evidence gates between model development and deployment.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08101B"/>
    <stop offset="100%" stop-color="#0E1828"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5DDCFF"/>
    <stop offset="55%" stop-color="#70E1C1"/>
    <stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>
</defs>
<rect width="1400" height="250" rx="24" fill="url(#bg)"/>
<text x="56" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7C91AA">HOW I ENGINEER ML SYSTEMS</text>
<path d="M130 130H1270" stroke="#314A67" stroke-width="3"/>
<path d="M130 130H1270" stroke="url(#flow)" stroke-width="3" opacity=".72"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <g transform="translate(130 130)">
    <circle r="29" fill="#102538" stroke="#3B9FC3" stroke-width="2"/>
    <text y="6" font-size="19" font-weight="800" fill="#8DE9FF">01</text>
    <text y="62" font-size="16" font-weight="700" fill="#EAF0F8">Frame</text>
    <text y="84" font-size="12" fill="#8FA2B8">problem + risk</text>
  </g>
  <g transform="translate(358 130)">
    <circle r="29" fill="#102538" stroke="#3B9FC3" stroke-width="2"/>
    <text y="6" font-size="19" font-weight="800" fill="#8DE9FF">02</text>
    <text y="62" font-size="16" font-weight="700" fill="#EAF0F8">Construct</text>
    <text y="84" font-size="12" fill="#8FA2B8">data + baseline</text>
  </g>
  <g transform="translate(586 130)">
    <circle r="29" fill="#102A29" stroke="#3A9A82" stroke-width="2"/>
    <text y="6" font-size="19" font-weight="800" fill="#9BEFD4">03</text>
    <text y="62" font-size="16" font-weight="700" fill="#EAF0F8">Model</text>
    <text y="84" font-size="12" fill="#8FA2B8">train + calibrate</text>
  </g>
  <g transform="translate(814 130)">
    <circle r="35" fill="#17243A" stroke="#70E1C1" stroke-width="3"/>
    <text y="6" font-size="19" font-weight="800" fill="#A9F2DC">04</text>
    <text y="66" font-size="16" font-weight="800" fill="#F2F7FC">Evidence Gate</text>
    <text y="88" font-size="12" fill="#9FB1C6">validate + analyze</text>
  </g>
  <g transform="translate(1042 130)">
    <circle r="29" fill="#1B2036" stroke="#7966B6" stroke-width="2"/>
    <text y="6" font-size="19" font-weight="800" fill="#CDBFFD">05</text>
    <text y="62" font-size="16" font-weight="700" fill="#EAF0F8">Integrate</text>
    <text y="84" font-size="12" fill="#8FA2B8">API + human review</text>
  </g>
  <g transform="translate(1270 130)">
    <circle r="29" fill="#1B2036" stroke="#7966B6" stroke-width="2"/>
    <text y="6" font-size="19" font-weight="800" fill="#CDBFFD">06</text>
    <text y="62" font-size="16" font-weight="700" fill="#EAF0F8">Operate</text>
    <text y="84" font-size="12" fill="#8FA2B8">observe + improve</text>
  </g>
</g>
</svg>