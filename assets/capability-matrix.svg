<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="305" viewBox="0 0 1400 305" role="img" aria-labelledby="title desc">
<title id="title">Technical capability matrix</title>
<desc id="desc">Three visual groups show Ahmad Abdullayev's machine learning, systems engineering, and mathematical foundation toolkit.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080E18"/>
    <stop offset="100%" stop-color="#101A2A"/>
  </linearGradient>
</defs>
<rect width="1400" height="305" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g transform="translate(38 34)">
    <rect width="412" height="237" rx="18" fill="#101B2B" stroke="#29425E"/>
    <text x="24" y="36" font-size="13" font-weight="800" letter-spacing="2.5" fill="#67DDFE">MACHINE LEARNING</text>
    <text x="24" y="68" font-size="18" font-weight="720" fill="#EDF3FA">Models are only one layer.</text>
    <g font-size="14" font-weight="650">
      <rect x="24" y="92" width="92" height="34" rx="17" fill="#11283B"/><text x="70" y="114" text-anchor="middle" fill="#A7EBFC">Python</text>
      <rect x="126" y="92" width="98" height="34" rx="17" fill="#11283B"/><text x="175" y="114" text-anchor="middle" fill="#A7EBFC">PyTorch</text>
      <rect x="234" y="92" width="142" height="34" rx="17" fill="#11283B"/><text x="305" y="114" text-anchor="middle" fill="#A7EBFC">scikit-learn</text>
      <rect x="24" y="138" width="91" height="34" rx="17" fill="#11283B"/><text x="69.5" y="160" text-anchor="middle" fill="#A7EBFC">pandas</text>
      <rect x="125" y="138" width="90" height="34" rx="17" fill="#11283B"/><text x="170" y="160" text-anchor="middle" fill="#A7EBFC">NumPy</text>
      <rect x="225" y="138" width="151" height="34" rx="17" fill="#11283B"/><text x="300.5" y="160" text-anchor="middle" fill="#A7EBFC">model evaluation</text>
      <rect x="24" y="184" width="143" height="34" rx="17" fill="#11283B"/><text x="95.5" y="206" text-anchor="middle" fill="#A7EBFC">error analysis</text>
      <rect x="177" y="184" width="199" height="34" rx="17" fill="#11283B"/><text x="276.5" y="206" text-anchor="middle" fill="#A7EBFC">calibration + abstention</text>
    </g>
  </g>

  <g transform="translate(494 34)">
    <rect width="412" height="237" rx="18" fill="#101B2B" stroke="#29425E"/>
    <text x="24" y="36" font-size="13" font-weight="800" letter-spacing="2.5" fill="#79E1C5">SYSTEMS ENGINEERING</text>
    <text x="24" y="68" font-size="18" font-weight="720" fill="#EDF3FA">Reliable behavior around the model.</text>
    <g font-size="14" font-weight="650">
      <rect x="24" y="92" width="102" height="34" rx="17" fill="#102A29"/><text x="75" y="114" text-anchor="middle" fill="#B0F2DD">FastAPI</text>
      <rect x="136" y="92" width="96" height="34" rx="17" fill="#102A29"/><text x="184" y="114" text-anchor="middle" fill="#B0F2DD">Django</text>
      <rect x="242" y="92" width="134" height="34" rx="17" fill="#102A29"/><text x="309" y="114" text-anchor="middle" fill="#B0F2DD">PostgreSQL</text>
      <rect x="24" y="138" width="92" height="34" rx="17" fill="#102A29"/><text x="70" y="160" text-anchor="middle" fill="#B0F2DD">Docker</text>
      <rect x="126" y="138" width="82" height="34" rx="17" fill="#102A29"/><text x="167" y="160" text-anchor="middle" fill="#B0F2DD">Linux</text>
      <rect x="218" y="138" width="158" height="34" rx="17" fill="#102A29"/><text x="297" y="160" text-anchor="middle" fill="#B0F2DD">testing + CI</text>
      <rect x="24" y="184" width="158" height="34" rx="17" fill="#102A29"/><text x="103" y="206" text-anchor="middle" fill="#B0F2DD">observability</text>
      <rect x="192" y="184" width="184" height="34" rx="17" fill="#102A29"/><text x="284" y="206" text-anchor="middle" fill="#B0F2DD">auditability + security</text>
    </g>
  </g>

  <g transform="translate(950 34)">
    <rect width="412" height="237" rx="18" fill="#101B2B" stroke="#29425E"/>
    <text x="24" y="36" font-size="13" font-weight="800" letter-spacing="2.5" fill="#B8A5FC">FOUNDATIONS</text>
    <text x="24" y="68" font-size="18" font-weight="720" fill="#EDF3FA">Depth before fashionable complexity.</text>
    <g font-size="14" font-weight="650">
      <rect x="24" y="92" width="104" height="34" rx="17" fill="#1B2036"/><text x="76" y="114" text-anchor="middle" fill="#D7CCFD">calculus</text>
      <rect x="138" y="92" width="145" height="34" rx="17" fill="#1B2036"/><text x="210.5" y="114" text-anchor="middle" fill="#D7CCFD">linear algebra</text>
      <rect x="293" y="92" width="83" height="34" rx="17" fill="#1B2036"/><text x="334.5" y="114" text-anchor="middle" fill="#D7CCFD">proofs</text>
      <rect x="24" y="138" width="118" height="34" rx="17" fill="#1B2036"/><text x="83" y="160" text-anchor="middle" fill="#D7CCFD">probability</text>
      <rect x="152" y="138" width="111" height="34" rx="17" fill="#1B2036"/><text x="207.5" y="160" text-anchor="middle" fill="#D7CCFD">statistics</text>
      <rect x="273" y="138" width="103" height="34" rx="17" fill="#1B2036"/><text x="324.5" y="160" text-anchor="middle" fill="#D7CCFD">algorithms</text>
      <rect x="24" y="184" width="145" height="34" rx="17" fill="#1B2036"/><text x="96.5" y="206" text-anchor="middle" fill="#D7CCFD">optimization</text>
      <rect x="179" y="184" width="197" height="34" rx="17" fill="#1B2036"/><text x="277.5" y="206" text-anchor="middle" fill="#D7CCFD">research methodology</text>
    </g>
  </g>
</g>
</svg>