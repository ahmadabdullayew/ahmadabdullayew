<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
<title id="title">Ahmad Abdullayev — Reliable Machine Learning Systems</title>
<desc id="desc">A dark professional engineering banner presenting Ahmad Abdullayev's identity, focus on reliable machine learning, and an evidence-first system pipeline.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#060A12"/>
    <stop offset="52%" stop-color="#0A1220"/>
    <stop offset="100%" stop-color="#101A2B"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5DDCFF"/>
    <stop offset="55%" stop-color="#70E1C1"/>
    <stop offset="100%" stop-color="#A78BFA"/>
  </linearGradient>
  <radialGradient id="orb" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#5DDCFF" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#5DDCFF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#30415B" stroke-width="1" opacity=".16"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000814" flood-opacity=".45"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="440" rx="28" fill="url(#background)"/>
<rect width="1400" height="440" rx="28" fill="url(#grid)"/>
<circle cx="1210" cy="40" r="280" fill="url(#orb)"/>
<circle cx="1110" cy="430" r="260" fill="#7457D9" opacity=".055"/>
<path d="M0 400 C250 335 420 462 710 390 S1120 330 1400 392" fill="none" stroke="#34506F" stroke-width="1.5" opacity=".32"/>

<g transform="translate(76 66)">
  <rect width="8" height="296" rx="4" fill="url(#accent)"/>
  <text x="38" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4.5" fill="#73DFFF">AHMAD ABDULLAYEV</text>
  <text x="38" y="101" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="760" fill="#F3F7FD">Reliable Machine</text>
  <text x="38" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="760" fill="#F3F7FD">Learning Systems</text>
  <text x="38" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="500" fill="#A8B6CA">Evaluation rigor · human oversight · production-minded software</text>

  <g transform="translate(38 248)">
    <rect width="162" height="40" rx="20" fill="#102538" stroke="#2B7596"/>
    <text x="81" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#8CE8FF">MACHINE LEARNING</text>
    <rect x="176" width="154" height="40" rx="20" fill="#102A29" stroke="#2A806B"/>
    <text x="253" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#9CF0D5">RELIABLE AI</text>
    <rect x="344" width="180" height="40" rx="20" fill="#1A2036" stroke="#6651A4"/>
    <text x="434" y="26" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#CBBDFB">RESEARCH SOFTWARE</text>
  </g>
</g>

<g transform="translate(885 64)" filter="url(#shadow)">
  <rect width="432" height="312" rx="20" fill="#09111D" stroke="#2A3D58" stroke-width="1.5"/>
  <rect width="432" height="44" rx="20" fill="#111C2C"/>
  <rect y="24" width="432" height="20" fill="#111C2C"/>
  <circle cx="24" cy="22" r="5" fill="#FF7B72"/>
  <circle cx="43" cy="22" r="5" fill="#F2CC60"/>
  <circle cx="62" cy="22" r="5" fill="#56D364"/>
  <text x="216" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#6F839E">engineering_profile.py</text>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">
    <text x="28" y="82" fill="#A8B6CA">engineer =</text>
    <text x="128" y="82" fill="#70E1C1">Engineer</text>
    <text x="197" y="82" fill="#A8B6CA">(</text>

    <text x="48" y="116" fill="#8AA3BF">focus</text>
    <text x="98" y="116" fill="#A8B6CA">=</text>
    <text x="116" y="116" fill="#F2CC8F">"reliable_ml"</text>
    <text x="244" y="116" fill="#A8B6CA">,</text>

    <text x="48" y="150" fill="#8AA3BF">method</text>
    <text x="108" y="150" fill="#A8B6CA">=</text>
    <text x="126" y="150" fill="#F2CC8F">"evidence_first"</text>
    <text x="285" y="150" fill="#A8B6CA">,</text>

    <text x="48" y="184" fill="#8AA3BF">domain</text>
    <text x="108" y="184" fill="#A8B6CA">=</text>
    <text x="126" y="184" fill="#F2CC8F">"high_consequence_ai"</text>
    <text x="335" y="184" fill="#A8B6CA">,</text>

    <text x="48" y="218" fill="#8AA3BF">status</text>
    <text x="108" y="218" fill="#A8B6CA">=</text>
    <text x="126" y="218" fill="#F2CC8F">"building"</text>
    <text x="232" y="218" fill="#A8B6CA">,</text>

    <text x="28" y="252" fill="#A8B6CA">)</text>
    <text x="28" y="286" fill="#6E7E93"># inspect -> evaluate -> verify -> ship</text>
  </g>
</g>

<g transform="translate(946 390)" font-family="Inter,Segoe UI,Arial,sans-serif">
  <circle cx="0" cy="0" r="5" fill="#5DDCFF" filter="url(#glow)"/>
  <path d="M8 0H75" stroke="#3A5877" stroke-width="2"/>
  <circle cx="83" cy="0" r="5" fill="#70E1C1" filter="url(#glow)"/>
  <path d="M91 0H158" stroke="#3A5877" stroke-width="2"/>
  <circle cx="166" cy="0" r="5" fill="#A78BFA" filter="url(#glow)"/>
  <path d="M174 0H241" stroke="#3A5877" stroke-width="2"/>
  <circle cx="249" cy="0" r="5" fill="#5DDCFF" filter="url(#glow)"/>
  <text x="124" y="27" text-anchor="middle" font-size="11" letter-spacing="2" fill="#607590">DATA · MODEL · EVIDENCE · SYSTEM</text>
