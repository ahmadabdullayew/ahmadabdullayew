<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first machine-learning system loop</title>
  <desc id="desc">Six connected stages: frame, baseline, validate, calibrate, integrate, and observe.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".5" stop-color="#70e1c1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1200" height="250" rx="22" fill="#0d1117" stroke="#30363d"/>
  <text x="48" y="47" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="750">Engineering operating model</text>
  <text x="48" y="73" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Models enter systems only after the evidence gate is satisfied.</text>

  <path d="M176 139H250M362 139H436M548 139H622M734 139H808M920 139H994" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="48" y="108" width="128" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="112" y="136" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="800" letter-spacing="1">FRAME</text>
      <text x="112" y="157" text-anchor="middle" fill="#8b949e" font-size="11">decision + risk</text>
    </g>
    <g>
      <rect x="250" y="108" width="112" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="306" y="136" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="800" letter-spacing="1">BASELINE</text>
      <text x="306" y="157" text-anchor="middle" fill="#8b949e" font-size="11">simple first</text>
    </g>
    <g>
      <rect x="436" y="101" width="112" height="78" rx="14" fill="#10243b" stroke="#58a6ff" stroke-width="2"/>
      <text x="492" y="134" text-anchor="middle" fill="#79c0ff" font-size="13" font-weight="800" letter-spacing="1">VALIDATE</text>
      <text x="492" y="156" text-anchor="middle" fill="#b6d7ff" font-size="11">leakage + error</text>
    </g>
    <g>
      <rect x="622" y="101" width="112" height="78" rx="14" fill="#102d28" stroke="#70e1c1" stroke-width="2"/>
      <text x="678" y="134" text-anchor="middle" fill="#8ff0d0" font-size="13" font-weight="800" letter-spacing="1">CALIBRATE</text>
      <text x="678" y="156" text-anchor="middle" fill="#b8f7e4" font-size="11">uncertainty</text>
    </g>
    <g>
      <rect x="808" y="108" width="112" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="864" y="136" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1">INTEGRATE</text>
      <text x="864" y="157" text-anchor="middle" fill="#8b949e" font-size="11">safe interface</text>
    </g>
    <g>
      <rect x="994" y="108" width="158" height="64" rx="14" fill="#161b22" stroke="#30363d"/>
      <text x="1073" y="136" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="800" letter-spacing="1">OBSERVE</text>
      <text x="1073" y="157" text-anchor="middle" fill="#8b949e" font-size="11">drift + feedback</text>
    </g>
  </g>

  <rect x="327" y="204" width="546" height="28" rx="14" fill="#161b22" stroke="url(#line)"/>
  <text x="600" y="223" text-anchor="middle" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Evidence gate: tests · metrics · reproducibility · documented limitations</text>
</svg>
