name: Update extended metrics

on:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: extended-profile-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate curated GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: profile/metrics.svg
          template: classic
          base: header, activity, community, metadata
          config_timezone: Asia/Baku
          config_display: columns
          config_order: base.header, base.activity+community, languages, base.metadata
          plugins_errors_fatal: yes

          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, tex, shell
