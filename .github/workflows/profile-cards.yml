name: Update profile cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate public activity card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&hide_border=true&bg_color=00000000&title_color=5DDCFF&text_color=A8B6CA&icon_color=70E1C1&ring_color=A78BFA&custom_title=Public%20Engineering%20Activity"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate repository language mix
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=html,css&hide_border=true&bg_color=00000000&title_color=5DDCFF&text_color=A8B6CA&custom_title=Repository%20Language%20Mix"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate weekly contribution cadence
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&mode=weekly&theme=transparent&hide_border=true&disable_animations=true&ring=70E1C1&fire=A78BFA&currStreakNum=F3F7FD&sideNums=F3F7FD&currStreakLabel=70E1C1&sideLabels=A8B6CA&dates=6F839E&stroke=263B54&background=00000000&border_radius=12"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): refresh generated activity cards"
          git push
