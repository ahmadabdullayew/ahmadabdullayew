name: Profile quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository (immutable revision)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python (immutable revision)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install -r requirements-validation.txt -r requirements-visual.txt
      - name: Test the profile contract, generator, and publication guard
        run: python -m unittest discover -s tests -v
      - name: Render SVGs at representative viewport sizes
        run: python scripts/check_visuals.py
      - name: Validate README, policy, and owned assets
        run: python scripts/validate_profile.py
      - name: Verify public profile on human-authored main pushes
        if: github.event_name == 'push' && github.repository == 'ahmadabdullayew/ahmadabdullayew'
        run: python scripts/profile_release.py verify-public --account ahmadabdullayew --sha "${{ github.sha }}"
